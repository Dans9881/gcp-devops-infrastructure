services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner

    environment:
      REPO_URL: https://github.com/Dans9881/php-docker-ci-cd-lab
      RUNNER_NAME: danzserver-runner
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_WORKDIR: /tmp/runner

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/tmp/runner
      - /srv/apps:/srv/apps

    restart: unless-stopped

    networks:
      - cicd

networks:
  cicd:
    external: true